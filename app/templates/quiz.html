{% extends 'base.html' %}
{% block title %}Quiz Generator | AI Study Assistant{% endblock %}
{% block page %}quiz{% endblock %}

{% block content %}
<section class="mb-4">
  <p class="section-tag mb-2">Assessment</p>
  <h1 class="page-heading">AI quiz generator</h1>
</section>

<div class="row g-4">
  <div class="col-lg-4">
    <div class="panel">
      <h3 class="mb-3">Build a quiz</h3>
      <form id="quiz-form">
        <div class="mb-3">
          <label class="form-label" for="quiz-material">Study material</label>
          <textarea id="quiz-material" class="form-control" rows="12" placeholder="Paste notes or textbook content here..." required></textarea>
        </div>

        <div class="mb-3">
          <label class="form-label" for="quiz-count">Number of questions</label>
          <input id="quiz-count" type="number" min="1" max="10" value="5" class="form-control" required />
        </div>

        <button type="submit" class="btn btn-primary w-100">
          <span class="button-text">Generate quiz</span>
          <span class="spinner-border spinner-border-sm d-none ms-2" role="status" aria-hidden="true"></span>
        </button>
      </form>
    </div>
  </div>

  <div class="col-lg-8">
    <div class="panel">
      <div id="quiz-output" class="empty-state">
        <i class="bi bi-question-circle fs-1 text-muted"></i>
        <p class="mt-3 mb-0">Your generated quiz will appear here.</p>
      </div>
    </div>
  </div>
</div>
{% endblock %}
