{% extends 'base.html' %}
{% block title %}Notes Summarizer | AI Study Assistant{% endblock %}
{% block page %}summarizer{% endblock %}

{% block content %}
<section class="mb-4">
  <p class="section-tag mb-2">AI writing</p>
  <h1 class="page-heading">Notes summarizer</h1>
</section>

<div class="row g-4">
  <div class="col-lg-5">
    <div class="panel">
      <h3 class="mb-3">Paste study notes</h3>
      <form id="summary-form">
        <div class="mb-3">
          <label class="form-label" for="summary-text">Notes</label>
          <textarea id="summary-text" class="form-control" rows="14" placeholder="Paste your notes, lecture transcript, or reading highlights here..." required></textarea>
        </div>

        <div class="mb-3">
          <label class="form-label" for="summary-style">Summary style</label>
          <select id="summary-style" class="form-select">
            <option>Short summary</option>
            <option>Detailed summary</option>
            <option>Important points</option>
          </select>
        </div>

        <button type="submit" class="btn btn-primary w-100">
          <span class="button-text">Generate summary</span>
          <span class="spinner-border spinner-border-sm d-none ms-2" role="status" aria-hidden="true"></span>
        </button>
      </form>
    </div>
  </div>

  <div class="col-lg-7">
    <div class="panel h-100">
      <h3 class="mb-3">Summary output</h3>
      <div id="summary-output" class="empty-state">
        <i class="bi bi-journal-text fs-1 text-muted"></i>
        <p class="mt-3 mb-0">Your summary will appear here.</p>
      </div>
    </div>
  </div>
</div>
{% endblock %}
